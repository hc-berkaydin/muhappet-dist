<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Muhappet</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23283860'/><rect x='18' y='26' width='46' height='30' rx='12' fill='%238ca0c8'/><rect x='38' y='48' width='46' height='30' rx='12' fill='%23fff'/></svg>">
<style>
/* Same palette as Theme.swift, so the two clients look like one product. */
:root {
  --bg:        #0e1119;
  --surface:   #1e2332;
  --surface-2: #2b3143;
  --accent:    #6d90e7;
  --out-bub:   #345198;
  --text:      #f2f2f2;
  --text-2:    #9ea6b5;
  --text-3:    #6b7280;
  --radius:    18px;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg); color: var(--text);
  font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  overflow: hidden;
}
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
input { font: inherit; }

/* ---------- sign in ---------- */
#login { height: 100%; display: grid; place-items: center; padding: 24px; }
#login form { width: 100%; max-width: 21rem; text-align: center; }
#login h1 { font-size: 2rem; margin: 0 0 4px; letter-spacing: -0.5px; }
#login p.sub { color: var(--text-2); margin: 0 0 28px; }
.lock { width: 62px; height: 62px; border-radius: 50%; background: var(--accent);
        display: grid; place-items: center; margin: 0 auto 18px; font-size: 28px; }
#login input {
  width: 100%; padding: 13px 14px; margin-bottom: 10px;
  background: var(--surface); border: 1.5px solid transparent;
  border-radius: 12px; color: var(--text); outline: none;
}
#login input:focus { border-color: var(--accent); }
#login button {
  width: 100%; padding: 14px; margin-top: 8px; border-radius: 12px;
  background: var(--accent); color: #fff; font-weight: 600;
}
#login button:disabled { background: var(--surface-2); color: var(--text-3); cursor: default; }
.error { color: #ff6b6b; font-size: 13px; min-height: 18px; margin-top: 10px; }
.hint { color: var(--text-3); font-size: 12px; margin-top: 22px; }

/* ---------- chat ---------- */
#chat { height: 100%; display: none; grid-template-rows: auto 1fr auto; max-width: 46rem; margin: 0 auto; }
header {
  display: flex; align-items: center; gap: 10px;
  padding: 12px 16px; border-bottom: 1px solid var(--surface);
  background: var(--bg);
}
.avatar {
  width: 34px; height: 34px; border-radius: 50%; flex: 0 0 auto;
  background: var(--surface-2); color: var(--accent);
  display: grid; place-items: center; font-size: 13px; font-weight: 600;
  object-fit: cover; overflow: hidden;
}
header .who { flex: 1; min-width: 0; }
header .name { font-weight: 600; }
header .status { font-size: 12px; color: var(--text-2); }
header .status.live { color: var(--accent); }
header button { color: var(--text-2); font-size: 13px; padding: 6px 10px; border-radius: 8px; }
header button:hover { background: var(--surface); }

#list { overflow-y: auto; padding: 14px 16px 6px; scroll-behavior: smooth; }
.day { text-align: center; margin: 16px 0 10px; }
.day span { background: var(--surface); color: var(--text-2); font-size: 11px;
            padding: 4px 10px; border-radius: 999px; }

.row { display: flex; margin-top: 2px; }
.row.first { margin-top: 10px; }
.row.mine { justify-content: flex-end; }
.bubble {
  max-width: min(78%, 30rem); padding: 7px 11px; border-radius: var(--radius);
  background: var(--surface); position: relative; word-wrap: break-word;
}
.row.mine .bubble { background: var(--out-bub); }
/* Tuck the corner facing the rest of a run, matching the iOS grouping. */
.row.mid  .bubble, .row.last .bubble { border-top-left-radius: 6px; }
.row.mid  .bubble, .row.first .bubble { border-bottom-left-radius: 6px; }
.row.mine.mid .bubble, .row.mine.last  .bubble { border-top-right-radius: 6px; border-top-left-radius: var(--radius); }
.row.mine.mid .bubble, .row.mine.first .bubble { border-bottom-right-radius: 6px; border-bottom-left-radius: var(--radius); }

.text { white-space: pre-wrap; }
.text.jumbo { font-size: 46px; line-height: 1.1; }
.meta { float: right; margin: 6px 0 0 8px; font-size: 11px; color: var(--text-3);
        display: inline-flex; align-items: center; gap: 3px; }
.row.mine .meta { color: rgba(255,255,255,0.62); }
.row.mine .meta.seen { color: #fff; }
.bubble img { max-width: 240px; max-height: 300px; border-radius: 13px;
              display: block; cursor: zoom-in; }
.reply { border-left: 3px solid var(--accent); padding: 3px 8px; margin-bottom: 5px;
         background: rgba(255,255,255,0.06); border-radius: 5px; font-size: 13px; }
.row.mine .reply { border-left-color: rgba(255,255,255,0.85); }
.reply b { display: block; color: var(--accent); font-size: 12px; }
.row.mine .reply b { color: rgba(255,255,255,0.95); }
.reply span { color: var(--text-2); }
.row.mine .reply span { color: rgba(255,255,255,0.75); }

.voice { display: flex; align-items: center; gap: 9px; }
.voice button.play { width: 32px; height: 32px; border-radius: 50%; flex: 0 0 auto;
  background: rgba(109,144,231,0.16); color: var(--accent); display: grid; place-items: center; }
.row.mine .voice button.play { background: rgba(255,255,255,0.22); color: #fff; }
.voice .bars { display: flex; align-items: center; gap: 2px; height: 24px; }
.voice .bars i { width: 2.5px; border-radius: 2px; background: var(--text-3); display: block; }
.row.mine .voice .bars i { background: rgba(255,255,255,0.4); }
.voice .len { font-size: 11px; color: var(--text-2); font-variant-numeric: tabular-nums; }
.row.mine .voice .len { color: rgba(255,255,255,0.7); }

.reacts { display: flex; gap: 4px; margin-top: 3px; }
.row.mine .reacts { justify-content: flex-end; }
.reacts button { background: var(--surface-2); border-radius: 999px; padding: 2px 7px; font-size: 13px; }
.reacts button.mine { outline: 1.5px solid var(--accent); }
.col { display: flex; flex-direction: column; max-width: 100%; }
.row.mine .col { align-items: flex-end; }
.pick { opacity: 0; transition: opacity .12s; align-self: center;
        color: var(--text-3); font-size: 15px; padding: 0 6px; }
.row:hover .pick { opacity: 1; }

.typing span { display: inline-block; width: 7px; height: 7px; border-radius: 50%;
  background: var(--text-2); margin-right: 4px; animation: blink 1.1s infinite; }
.typing span:nth-child(2) { animation-delay: .18s; }
.typing span:nth-child(3) { animation-delay: .36s; }
@keyframes blink { 0%,100% { opacity: .3; transform: scale(.75) } 50% { opacity: 1; transform: scale(1) } }

footer { display: flex; align-items: flex-end; gap: 8px; padding: 10px 16px 14px;
         border-top: 1px solid var(--surface); }
footer textarea {
  flex: 1; resize: none; max-height: 8rem; padding: 10px 14px;
  background: var(--surface); border: 0; border-radius: 20px;
  color: var(--text); font: inherit; outline: none;
}
footer button.icon { width: 36px; height: 36px; border-radius: 50%; font-size: 18px;
                     color: var(--text-2); display: grid; place-items: center; }
footer button.icon:hover { background: var(--surface); }
footer button.send { background: var(--accent); color: #fff; }
footer button.send:disabled { background: var(--surface-2); color: var(--text-3); cursor: default; }
#replying { display: none; align-items: center; gap: 9px; padding: 8px 16px 0; font-size: 13px; }
#replying .bar { width: 3px; height: 30px; background: var(--accent); border-radius: 2px; }
#replying .who { color: var(--accent); font-weight: 600; font-size: 12px; }
#replying .txt { color: var(--text-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#replying button { margin-left: auto; color: var(--text-3); }

#lightbox { position: fixed; inset: 0; background: rgba(0,0,0,.92); display: none;
            place-items: center; z-index: 20; cursor: zoom-out; }
#lightbox img { max-width: 94vw; max-height: 94vh; }
.hidden { display: none !important; }
</style>
</head>
<body>

<div id="login">
  <form id="loginForm">
    <div class="lock">🔒</div>
    <h1>Muhappet</h1>
    <p class="sub">Just the two of us.</p>
    <input id="email" type="email" placeholder="Email" autocomplete="username" required>
    <input id="password" type="password" placeholder="Password" autocomplete="current-password" required>
    <button id="loginBtn" type="submit">Sign in</button>
    <div class="error" id="loginError"></div>
    <p class="hint">Same account as the phone app.</p>
  </form>
</div>

<div id="chat">
  <header>
    <div class="avatar" id="partnerAvatar">?</div>
    <div class="who">
      <div class="name" id="partnerName">Chat</div>
      <div class="status" id="partnerStatus"></div>
    </div>
    <button id="signOut">Sign out</button>
  </header>

  <div id="list"></div>

  <div>
    <div id="replying">
      <div class="bar"></div>
      <div style="min-width:0">
        <div class="who" id="replyWho"></div>
        <div class="txt" id="replyTxt"></div>
      </div>
      <button id="cancelReply">✕</button>
    </div>
    <footer>
      <button class="icon" id="photoBtn" title="Send a photo">🖼</button>
      <input type="file" id="photoInput" accept="image/*" class="hidden">
      <textarea id="input" rows="1" placeholder="Message"></textarea>
      <button class="icon send" id="sendBtn" disabled title="Send">↑</button>
    </footer>
  </div>
</div>

<div id="lightbox"><img alt=""></div>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2.58.0'

// The publishable key is meant to be public: every table sits behind row-level
// security and the two-row members allowlist, so on its own it grants nothing.
const SUPABASE_URL = 'https://bwdugvxjnbanwhbowmxx.supabase.co'
const SUPABASE_KEY = 'sb_publishable_tKX8JdlIcqqCIpffdvfKfg_pVaSLFO8'
const BUCKET = 'chat-media'
const CHANNEL = 'muhappet'
const PAGE = 100
const ONLINE_WINDOW = 70_000

const sb = createClient(SUPABASE_URL, SUPABASE_KEY)

const $ = id => document.getElementById(id)
const state = {
  me: null, partner: null, messages: [], reactions: new Map(),
  media: new Map(), channel: null, replyingTo: null,
  typingTimer: null, lastTyping: 0, audio: null, playingPath: null,
}

// ---------------------------------------------------------------- auth

sb.auth.onAuthStateChange((_event, session) => {
  if (session?.user) { start(session.user) } else { showLogin() }
})

$('loginForm').addEventListener('submit', async event => {
  event.preventDefault()
  const btn = $('loginBtn')
  btn.disabled = true
  $('loginError').textContent = ''
  const { error } = await sb.auth.signInWithPassword({
    email: $('email').value.trim().toLowerCase(),
    password: $('password').value,
  })
  btn.disabled = false
  if (error) {
    $('loginError').textContent = /invalid/i.test(error.message)
      ? "That email and password don't match." : error.message
  }
})

$('signOut').addEventListener('click', async () => {
  if (state.channel) await sb.removeChannel(state.channel)
  await sb.auth.signOut()
  location.reload()
})

function showLogin() {
  $('login').style.display = 'grid'
  $('chat').style.display = 'none'
}

// ---------------------------------------------------------------- boot

async function start(user) {
  state.me = user
  $('login').style.display = 'none'
  $('chat').style.display = 'grid'

  await loadProfiles()
  await loadMessages()
  await loadReactions()
  render()
  subscribe()
  markRead()
  heartbeat()
  setInterval(renderStatus, 30_000)
}

async function loadProfiles() {
  const { data } = await sb.from('profiles').select('*').limit(2)
  state.partner = (data ?? []).find(p => p.id !== state.me.id) ?? null
  renderHeader()
}

async function loadMessages() {
  const { data } = await sb.from('messages').select('*')
    .order('created_at', { ascending: false }).limit(PAGE)
  state.messages = (data ?? []).reverse()
}

async function loadReactions() {
  const { data } = await sb.from('reactions').select('*')
  state.reactions = new Map()
  for (const r of data ?? []) {
    const list = state.reactions.get(r.message_id) ?? []
    list.push(r)
    state.reactions.set(r.message_id, list)
  }
}

// ---------------------------------------------------------------- realtime

function subscribe() {
  const channel = sb.channel(CHANNEL)
  state.channel = channel

  channel
    .on('postgres_changes', { event: '*', schema: 'public', table: 'messages' }, payload => {
      if (payload.eventType === 'DELETE') {
        state.messages = state.messages.filter(m => m.id !== payload.old.id)
      } else {
        upsert(payload.new)
        if (payload.eventType === 'INSERT' && payload.new.sender_id !== state.me.id) markRead()
      }
      render()
    })
    .on('postgres_changes', { event: '*', schema: 'public', table: 'reactions' }, payload => {
      const row = payload.eventType === 'DELETE' ? payload.old : payload.new
      const list = (state.reactions.get(row.message_id) ?? []).filter(r => r.user_id !== row.user_id)
      if (payload.eventType !== 'DELETE') list.push(row)
      list.length ? state.reactions.set(row.message_id, list) : state.reactions.delete(row.message_id)
      render()
    })
    .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'profiles' }, payload => {
      if (payload.new.id !== state.me.id) { state.partner = payload.new; renderHeader() }
    })
    .on('broadcast', { event: 'typing' }, ({ payload }) => {
      if (!payload || payload.from === state.me.id) return
      showTyping(payload.typing)
    })
    .subscribe()
}

function upsert(row) {
  const index = state.messages.findIndex(m => m.id === row.id)
  if (index >= 0) { state.messages[index] = row; return }
  const rowAt = parseStamp(row.created_at)?.getTime() ?? 0
  const at = state.messages.findIndex(m => (parseStamp(m.created_at)?.getTime() ?? 0) > rowAt)
  at === -1 ? state.messages.push(row) : state.messages.splice(at, 0, row)
}

// ---------------------------------------------------------------- sending

async function sendText() {
  const body = $('input').value.trim()
  if (!body) return
  $('input').value = ''
  autoGrow()
  updateSendState()

  const draft = {
    id: crypto.randomUUID(), sender_id: state.me.id, body,
    created_at: new Date().toISOString(), reply_to: state.replyingTo?.id ?? null,
  }
  clearReply()
  upsert(draft); render()

  const { error } = await sb.from('messages').insert({
    id: draft.id, sender_id: state.me.id, body, reply_to: draft.reply_to,
  })
  if (error) console.error('send failed', error)
  broadcastTyping(false)
}

$('photoBtn').addEventListener('click', () => $('photoInput').click())
$('photoInput').addEventListener('change', async event => {
  const file = event.target.files?.[0]
  event.target.value = ''
  if (!file) return

  const id = crypto.randomUUID()
  // Storage policy compares the folder against auth.uid()::text, which Postgres
  // renders lowercase — so the path has to be lowercase too.
  const path = `${state.me.id.toLowerCase()}/${id}.jpg`

  const blob = await shrink(file)
  state.media.set(path, URL.createObjectURL(blob))

  const draft = { id, sender_id: state.me.id, image_path: path,
                  created_at: new Date().toISOString(), reply_to: state.replyingTo?.id ?? null }
  clearReply()
  upsert(draft); render()

  const { error } = await sb.storage.from(BUCKET).upload(path, blob, { contentType: 'image/jpeg' })
  if (error) { console.error('upload failed', error); return }
  await sb.from('messages').insert({
    id, sender_id: state.me.id, image_path: path, reply_to: draft.reply_to,
  })
})

/// Match the phone client: cap the long edge at 1600px before uploading.
async function shrink(file, max = 1600, quality = 0.8) {
  const bitmap = await createImageBitmap(file)
  const scale = Math.min(1, max / Math.max(bitmap.width, bitmap.height))
  const canvas = document.createElement('canvas')
  canvas.width = Math.round(bitmap.width * scale)
  canvas.height = Math.round(bitmap.height * scale)
  canvas.getContext('2d').drawImage(bitmap, 0, 0, canvas.width, canvas.height)
  return new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg', quality))
}

async function markRead() {
  if (!state.messages.some(m => m.sender_id !== state.me.id && !m.read_at)) return
  await sb.rpc('mark_read')
}

async function react(messageID, emoji) {
  const mine = (state.reactions.get(messageID) ?? []).find(r => r.user_id === state.me.id)
  if (mine?.emoji === emoji) {
    await sb.from('reactions').delete().eq('message_id', messageID).eq('user_id', state.me.id)
  } else {
    await sb.from('reactions').upsert(
      { message_id: messageID, user_id: state.me.id, emoji },
      { onConflict: 'message_id,user_id' })
  }
}

// ---------------------------------------------------------------- presence

function broadcastTyping(typing) {
  state.channel?.send({ type: 'broadcast', event: 'typing',
                        payload: { from: state.me.id, typing } })
}

async function heartbeat() {
  const beat = () => sb.from('profiles')
    .update({ last_seen: new Date().toISOString() }).eq('id', state.me.id)
  await beat()
  setInterval(beat, 25_000)
}

let typingHideTimer = null
function showTyping(on) {
  clearTimeout(typingHideTimer)
  state.partnerTyping = on
  renderStatus()
  if (on) typingHideTimer = setTimeout(() => { state.partnerTyping = false; renderStatus() }, 6000)
}

// ---------------------------------------------------------------- rendering

function initials(name) {
  return (name ?? '').split(' ').slice(0, 2).map(w => w[0] ?? '').join('').toUpperCase() || '?'
}

async function renderHeader() {
  $('partnerName').textContent = state.partner?.display_name ?? 'Chat'
  const avatar = $('partnerAvatar')
  avatar.textContent = initials(state.partner?.display_name)
  if (state.partner?.avatar_path) {
    const url = await mediaURL(state.partner.avatar_path)
    if (url) avatar.innerHTML = `<img src="${url}" style="width:100%;height:100%;object-fit:cover">`
  }
  renderStatus()
}

function renderStatus() {
  const el = $('partnerStatus')
  if (state.partnerTyping) { el.textContent = 'typing…'; el.className = 'status live'; return }
  const seen = parseStamp(state.partner?.last_seen)
  if (!seen) { el.textContent = ''; return }
  const ago = Date.now() - seen.getTime()
  if (ago < ONLINE_WINDOW) { el.textContent = 'online'; el.className = 'status live'; return }
  el.className = 'status'
  el.textContent = 'last seen ' + (
    ago < 3_600_000 ? `${Math.round(ago / 60000)} min ago`
    : seen.toDateString() === new Date().toDateString()
      ? 'at ' + seen.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
      : seen.toLocaleDateString([], { day: 'numeric', month: 'short' }))
}

async function mediaURL(path) {
  if (state.media.has(path)) return state.media.get(path)
  const { data, error } = await sb.storage.from(BUCKET).download(path)
  if (error) return null
  const url = URL.createObjectURL(data)
  state.media.set(path, url)
  return url
}

/// Postgres timestamps are not what `new Date()` expects. Depending on the path
/// they arrive as "2026-08-04T09:17:24.671702+00:00" (six fractional digits,
/// which is not ISO 8601) or "2026-08-04 09:17:24.671702+00" (a space instead
/// of T, and a two-digit zone). Safari rejects all three variants outright and
/// Chrome only tolerates some — hence "Invalid Date" everywhere.
///
/// The phone client needed the same normalisation; this is that fix, ported.
function parseStamp(value) {
  if (!value) return null
  if (value instanceof Date) return isNaN(value) ? null : value

  let text = String(value).trim()
    .replace(' ', 'T')                       // space separator → T
    .replace(/(\.\d{3})\d+/, '$1')            // microseconds → milliseconds
    .replace(/([+-]\d{2})$/, '$1:00')         // +00 → +00:00

  // No zone at all means UTC, which is what Postgres stores.
  if (!/([Zz]|[+-]\d{2}:\d{2})$/.test(text)) text += 'Z'

  const parsed = new Date(text)
  return isNaN(parsed) ? null : parsed
}

const isEmojiOnly = text =>
  text.length <= 6 && /^\p{Extended_Pictographic}+$/u.test(text.replace(/️/g, ''))

const timeLabel = iso => {
  const d = parseStamp(iso)
  return d ? d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : ''
}

function dayLabel(iso) {
  const d = parseStamp(iso)
  if (!d) return ''
  const today = new Date()
  const yesterday = new Date(Date.now() - 86_400_000)
  if (d.toDateString() === today.toDateString()) return 'Today'
  if (d.toDateString() === yesterday.toDateString()) return 'Yesterday'
  return d.toLocaleDateString([], { day: 'numeric', month: 'short', year: 'numeric' })
}

function render() {
  const list = $('list')
  const nearBottom = list.scrollHeight - list.scrollTop - list.clientHeight < 120
  list.innerHTML = ''

  let lastDay = null, lastSender = null, lastTime = 0
  const newest = [...state.messages].reverse().find(m => m.sender_id === state.me.id)

  state.messages.forEach(message => {
    const day = parseStamp(message.created_at)?.toDateString() ?? 
    if (day !== lastDay) {
      list.insertAdjacentHTML('beforeend',
        `<div class="day"><span>${dayLabel(message.created_at)}</span></div>`)
      lastDay = day; lastSender = null
    }

    const stamp = parseStamp(message.created_at)?.getTime() ?? 0
    const grouped = message.sender_id === lastSender && stamp - lastTime < 300_000
    lastSender = message.sender_id; lastTime = stamp

    list.appendChild(renderRow(message, grouped, message.id === newest?.id))
  })

  if (state.partnerTyping) {
    list.insertAdjacentHTML('beforeend',
      `<div class="row"><div class="bubble typing"><span></span><span></span><span></span></div></div>`)
  }
  if (nearBottom) list.scrollTop = list.scrollHeight
}

function renderRow(message, grouped, isNewestMine) {
  const mine = message.sender_id === state.me.id
  const row = document.createElement('div')
  row.className = `row ${mine ? 'mine' : ''} ${grouped ? 'mid' : 'first'}`

  const col = document.createElement('div')
  col.className = 'col'

  const bubble = document.createElement('div')
  bubble.className = 'bubble'

  // Quoted reply
  if (message.reply_to) {
    const target = state.messages.find(m => m.id === message.reply_to)
    const who = target ? (target.sender_id === state.me.id ? 'You' : state.partner?.display_name ?? 'Them') : 'Message'
    const what = target ? (target.image_path ? '📷 Photo' : target.audio_path ? '🎤 Voice message' : target.body ?? '') : 'unavailable'
    bubble.insertAdjacentHTML('beforeend',
      `<div class="reply"><b>${escapeHTML(who)}</b><span>${escapeHTML(what.slice(0, 80))}</span></div>`)
  }

  if (message.image_path) {
    const img = document.createElement('img')
    img.alt = 'photo'
    mediaURL(message.image_path).then(url => { if (url) img.src = url })
    img.addEventListener('click', () => openLightbox(img.src))
    bubble.appendChild(img)
  }

  if (message.audio_path) bubble.appendChild(renderVoice(message))

  if (message.body) {
    const text = document.createElement('div')
    text.className = 'text' + (isEmojiOnly(message.body) ? ' jumbo' : '')
    text.textContent = message.body
    bubble.appendChild(text)
  }

  // Time and ticks, tucked inside the bubble like the phone client.
  const ticks = !mine ? '' : message.read_at ? '✓✓' : '✓'
  bubble.insertAdjacentHTML('beforeend',
    `<span class="meta${mine && message.read_at && isNewestMine ? ' seen' : ''}">${timeLabel(message.created_at)} ${ticks}</span>`)

  col.appendChild(bubble)

  const reactions = state.reactions.get(message.id) ?? []
  if (reactions.length) {
    const wrap = document.createElement('div')
    wrap.className = 'reacts'
    const counts = {}
    for (const r of reactions) counts[r.emoji] = (counts[r.emoji] ?? 0) + 1
    for (const [emoji, count] of Object.entries(counts)) {
      const mineHere = reactions.some(r => r.emoji === emoji && r.user_id === state.me.id)
      const button = document.createElement('button')
      button.className = mineHere ? 'mine' : ''
      button.textContent = count > 1 ? `${emoji} ${count}` : emoji
      button.addEventListener('click', () => react(message.id, emoji))
      wrap.appendChild(button)
    }
    col.appendChild(wrap)
  }

  const pick = document.createElement('button')
  pick.className = 'pick'
  pick.textContent = '☺'
  pick.title = 'React'
  pick.addEventListener('click', () => openPicker(message.id, pick))

  const reply = document.createElement('button')
  reply.className = 'pick'
  reply.textContent = '↩'
  reply.title = 'Reply'
  reply.addEventListener('click', () => setReply(message))

  mine ? row.append(reply, pick, col) : row.append(col, pick, reply)
  return row
}

function renderVoice(message) {
  const wrap = document.createElement('div')
  wrap.className = 'voice'

  const play = document.createElement('button')
  play.className = 'play'
  play.textContent = '▶'

  const bars = document.createElement('div')
  bars.className = 'bars'
  // Deterministic per path, so a note looks the same every render.
  let seed = [...message.audio_path].reduce((a, c) => (a * 31 + c.charCodeAt(0)) | 0, 7)
  for (let i = 0; i < 28; i++) {
    seed = (seed * 1103515245 + 12345) & 0x7fffffff
    const bar = document.createElement('i')
    bar.style.height = `${5 + (seed % 100) / 100 * 18}px`
    bars.appendChild(bar)
  }

  const len = document.createElement('span')
  len.className = 'len'
  len.textContent = fmtLength(message.audio_duration ?? 0)

  play.addEventListener('click', async () => {
    if (state.playingPath === message.audio_path && state.audio && !state.audio.paused) {
      state.audio.pause(); play.textContent = '▶'; return
    }
    state.audio?.pause()
    const url = await mediaURL(message.audio_path)
    if (!url) return
    const audio = new Audio(url)
    state.audio = audio
    state.playingPath = message.audio_path
    audio.addEventListener('timeupdate', () => {
      const done = Math.floor(bars.children.length * (audio.currentTime / (audio.duration || 1)))
      ;[...bars.children].forEach((bar, i) => {
        bar.style.background = i <= done ? 'currentColor' : ''
      })
      len.textContent = fmtLength((audio.duration || 0) - audio.currentTime)
    })
    audio.addEventListener('ended', () => {
      play.textContent = '▶'
      ;[...bars.children].forEach(bar => { bar.style.background = '' })
      len.textContent = fmtLength(message.audio_duration ?? 0)
    })
    audio.play()
    play.textContent = '❚❚'
  })

  wrap.append(play, bars, len)
  return wrap
}

const fmtLength = seconds => {
  const total = Math.max(0, Math.round(seconds))
  return `${Math.floor(total / 60)}:${String(total % 60).padStart(2, '0')}`
}

const escapeHTML = s => s.replace(/[&<>"']/g, c =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]))

// ---------------------------------------------------------------- pickers

const EMOJI = ['❤️', '😂', '👍', '🔥', '😮', '😢']
function openPicker(messageID, anchor) {
  document.querySelector('.picker')?.remove()
  const box = document.createElement('div')
  box.className = 'picker'
  box.style.cssText = `position:fixed;background:var(--surface-2);border-radius:999px;
    padding:6px 8px;display:flex;gap:4px;z-index:30;box-shadow:0 6px 20px rgba(0,0,0,.5)`
  for (const emoji of EMOJI) {
    const button = document.createElement('button')
    button.textContent = emoji
    button.style.fontSize = '20px'
    button.addEventListener('click', () => { react(messageID, emoji); box.remove() })
    box.appendChild(button)
  }
  document.body.appendChild(box)
  const rect = anchor.getBoundingClientRect()
  box.style.top = `${Math.max(8, rect.top - 46)}px`
  box.style.left = `${Math.min(rect.left - 90, innerWidth - box.offsetWidth - 8)}px`
  setTimeout(() => document.addEventListener('click', function once(event) {
    if (!box.contains(event.target)) { box.remove(); document.removeEventListener('click', once) }
  }), 0)
}

function setReply(message) {
  state.replyingTo = message
  $('replying').style.display = 'flex'
  $('replyWho').textContent = 'Replying to ' +
    (message.sender_id === state.me.id ? 'You' : state.partner?.display_name ?? 'Them')
  $('replyTxt').textContent = message.image_path ? '📷 Photo'
    : message.audio_path ? '🎤 Voice message' : message.body ?? ''
  $('input').focus()
}
function clearReply() { state.replyingTo = null; $('replying').style.display = 'none' }
$('cancelReply').addEventListener('click', clearReply)

function openLightbox(src) {
  const box = $('lightbox')
  box.querySelector('img').src = src
  box.style.display = 'grid'
}
$('lightbox').addEventListener('click', () => { $('lightbox').style.display = 'none' })

// ---------------------------------------------------------------- composer

const input = $('input')
function autoGrow() { input.style.height = 'auto'; input.style.height = `${input.scrollHeight}px` }
function updateSendState() { $('sendBtn').disabled = !input.value.trim() }

input.addEventListener('input', () => {
  autoGrow(); updateSendState()
  const now = Date.now()
  if (now - state.lastTyping > 2000) { state.lastTyping = now; broadcastTyping(true) }
  clearTimeout(state.typingTimer)
  state.typingTimer = setTimeout(() => broadcastTyping(false), 3000)
})
input.addEventListener('keydown', event => {
  // Enter sends; Shift+Enter starts a new line, as on every desktop messenger.
  if (event.key === 'Enter' && !event.shiftKey) { event.preventDefault(); sendText() }
})
$('sendBtn').addEventListener('click', sendText)
document.addEventListener('visibilitychange', () => { if (!document.hidden) markRead() })
</script>
</body>
